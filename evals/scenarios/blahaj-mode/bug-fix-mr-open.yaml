skill: blahaj-mode
description: Selects the explicit MR tail only after the bug-fix work.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p tests
  cat > AGENTS.md <<'MD'
  # Fixture repo

  ## Checks
  - test: `bash tests/check.sh`
  MD
  echo 'broken' > app.txt
  cat > tests/check.sh <<'SH'
  #!/usr/bin/env bash
  set -eu
  if grep -qx fixed app.txt; then
    echo '--- repo verify pass' >> "$CALLS_LOG"
    touch "$WORK/.verify-ran"
  else
    echo '--- repo reproduce fail' >> "$CALLS_LOG"
    exit 1
  fi
  SH
  chmod +x tests/check.sh
  git add -A && git commit -qm init
  git checkout -qb fix/mr-open
  cat > branch-helper.sh <<'SH'
  # Prepare the branch for review.
  true
  SH
  git add branch-helper.sh && git commit -qm 'chore: add branch helper'

prompt: |
  Use blahaj-mode to fix this bug: app.txt must contain "fixed". Reproduce it,
  with bash tests/check.sh, implement the fix, run the repository checks, and
  then explicitly open an MR.

fixtures:
  - match: mr view
    response: |
      null
  - match: mr create
    response: |
      {"id":8,"web_url":"https://gitlab.example.com/ostack/-/merge_requests/8"}

assert:
  output_contains:
    - "Route: bug-fix -> mr-open"
    - "no-comments"
    - "https://gitlab.example.com/ostack/-/merge_requests/8"
  tools_called:
    - "glab mr view"
    - "glab mr create"
  custom: |
    set -eu
    grep -qx fixed app.txt
    grep -qx true branch-helper.sh
    test -e "$WORK/.verify-ran"
    reproduce_line="$(grep -n '^--- repo reproduce fail' "$CALLS_LOG" | head -1 | cut -d: -f1)"
    verify_line="$(grep -n '^--- repo verify pass' "$CALLS_LOG" | head -1 | cut -d: -f1)"
    mr_line="$(grep -n '^--- glab mr create' "$CALLS_LOG" | head -1 | cut -d: -f1)"
    test -n "$reproduce_line" && test -n "$verify_line" && test -n "$mr_line"
    test "$reproduce_line" -lt "$verify_line" && test "$verify_line" -lt "$mr_line"
