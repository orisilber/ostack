skill: djungelskog-mode
description: Autonomous entry respects an explicit no-PR constraint and stops at local-change.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  echo 'before' > app.txt
  git add app.txt && git commit -qm init

prompt: |
  Use djungelskog-mode for this request. Change app.txt to contain "after".
  Do this autonomously, but do not open a PR or MR and do not contact any
  external system.

assert:
  output_contains:
    - "Route: (feature -> local-change|none)"
  custom: |
    set -eu
    grep -qx after app.txt
    if grep -Eq '^--- (gh|glab|acli) |^--- git .*push' "$CALLS_LOG"; then
      echo "unexpected external operation" >&2
      exit 1
    fi
