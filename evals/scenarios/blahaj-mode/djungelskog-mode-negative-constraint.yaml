skill: djungelskog-mode
description: Autonomous entry respects an explicit no-PR constraint and stops at local-change.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  echo 'before' > app.txt
  git add app.txt && git commit -qm init

prompt: |
  Change app.txt to contain "after". Do this autonomously, but do not open a PR
  or MR and do not contact any external system.

assert:
  output_contains:
    - "Route: feature -> local-change"
  custom: |
    set -eu
    grep -qx after app.txt
    if grep -q '^--- glab ' "$CALLS_LOG"; then
      echo "unexpected external glab call" >&2
      exit 1
    fi
