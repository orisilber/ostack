skill: blahaj-mode
description: Uses arena when one feature implementation would lock in a consequential choice.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p src tests
  cat > tests/check.sh <<'SH'
  #!/usr/bin/env bash
  set -eu
  PYTHONPATH=. python3 -c 'from src.dedup import RequestDeduplicator; d = RequestDeduplicator(); calls = []; work = lambda: calls.append(1) or "ok"; assert d.run("same", work) == "ok"; assert d.run("same", work) == "ok"; assert len(calls) == 1'
  touch "$WORK/.verify-ran"
  SH
  chmod +x tests/check.sh
  cat > AGENTS.md <<'MD'
  # Fixture repo

  ## Checks
  - test: `bash tests/check.sh`
  MD
  git add -A && git commit -qm init

prompt: |
  Use blahaj-mode to add request deduplication. Both a shared in-flight registry
  and a queue-owned design fit the current code, but choosing the wrong ownership
  model would force a costly rewrite. Explore the viable implementations and
  select one with evidence. Implement src/dedup.py with RequestDeduplicator.run;
  repeated completed calls for one key must execute the work function once. Run
  the repository check and keep the change local. Do not open an MR.

assert:
  output_contains:
    - "Route: feature -> local-change"
    - "arena"
  tools_not_called:
    - "glab mr"
  custom: |
    set -eu
    test -s src/dedup.py
    test -e "$WORK/.verify-ran"
    PYTHONPATH=. python3 -c 'from src.dedup import RequestDeduplicator; d = RequestDeduplicator(); calls = []; work = lambda: calls.append(1) or "ok"; assert d.run("same", work) == "ok"; assert d.run("same", work) == "ok"; assert len(calls) == 1'
