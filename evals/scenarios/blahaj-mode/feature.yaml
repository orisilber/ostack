skill: blahaj-mode
description: Routes a small feature to local change and records skipped design fan-out.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p tests
  cat > tests/check.sh <<'SH'
  #!/usr/bin/env bash
  set -eu
  PYTHONPATH=. python3 -c 'from helper import greet; assert greet("Ori") == "Hello, Ori"'
  touch "$WORK/.verify-ran"
  SH
  chmod +x tests/check.sh
  cat > AGENTS.md <<'MD'
  # Fixture repo

  ## Checks
  - test: `bash tests/check.sh`
  MD
  echo '# fixture' > README.md
  git add -A && git commit -qm init

prompt: |
  Use blahaj-mode to add helper.py following the existing local pattern. It
  must export greet(name) and return "Hello, <name>". Make the local change and
  run the repository check; do not open an MR.

assert:
  output_contains:
    - "Route: feature -> local-change"
    - "architect skipped"
    - "arena skipped"
  tools_not_called:
    - "glab mr create"
  custom: |
    set -eu
    test -s helper.py
    test -e "$WORK/.verify-ran"
    PYTHONPATH=. python3 -c 'from helper import greet; assert greet("Ori") == "Hello, Ori"'
