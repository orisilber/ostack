skill: ostack-mode
description: Runs the static and YAML evaluation layers without an external write.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  echo '# fixture' > README.md
  git add -A && git commit -qm init

prompt: |
  Use ostack-mode to run the skill-library evaluation gate and the relevant
  local YAML scenarios. Report failures; do not open an MR.

assert:
  output_contains:
    - "Route: eval -> local-change"
  tools_not_called:
    - "glab mr"
