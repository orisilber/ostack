skill: ostack-mode
description: Routes behavior-preserving structural work to refactoring.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p tests
  echo 'def old_name(): return 1' > app.py
  cat > tests/check.sh <<'SH'
  #!/usr/bin/env bash
  set -eu
  PYTHONPATH=. python3 -c 'import app; fn = getattr(app, "new_name", None) or getattr(app, "old_name"); assert fn() == 1'
  touch "$WORK/.verify-ran"
  SH
  chmod +x tests/check.sh
  cat > AGENTS.md <<'MD'
  # Fixture repo

  ## Checks
  - test: `bash tests/check.sh`
  MD
  git add -A && git commit -qm init

prompt: |
  Use ostack-mode to rename old_name to new_name without changing behavior.
  Pin the behavior, subtract dead wrappers, make the local change, and verify
  it. Do not open an MR.

assert:
  output_contains:
    - "Route: refactoring -> local-change"
    - "Laziness Protocol"
  custom: |
    set -eu
    grep -q 'def new_name' app.py
    ! grep -q 'def old_name' app.py
    test -e "$WORK/.verify-ran"
    PYTHONPATH=. python3 -c 'from app import new_name; assert new_name() == 1'
