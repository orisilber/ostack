skill: pick-next-task
description: Claims the one agent-ready issue and never touches the others.

setup: |
  git init -q --bare "$WORK/fake-origin.git"
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  echo "# fixture" > README.md
  mkdir -p src && echo "console.log(1)" > src/app.ts
  cat > AGENTS.md <<'MD'
  # Fixture repo

  ## Checks
  - test: `npm test`
  MD
  git add -A && git commit -qm "feat(DMI-100): initial"
  git commit -q --allow-empty -m "chore(DMI-101): filler"
  git remote add origin "$WORK/fake-origin.git"
  git push -q -u origin main

prompt: |
  Pick my next task from Jira project DMI and claim it. This project-wide queue
  has one dispatcher for automated claims, and this run owns that dispatcher;
  no other automated claimant may assign work during this run. The verified
  current account ID is agent-1. Re-read the complete issue before assigning,
  then use the assignee-only view to confirm ownership. Create its branch and
  return a handoff without starting implementation or posting a tracker comment.

fixtures:
  - match: auth status
    response: |
      ✓ Authenticated as agent@ostack.dev (https://jira.example.com)
  - match: currentUser
    response: |
      key
      DMI-99
  - match: view.*DMI-99
    response: |
      {"key":"DMI-99","fields":{"customfield_10057":{"id":"10199","self":"https://jira.example.com/rest/api/3/customFieldOption/10199","value":"Unicorns"}}}
  - match: workitem search
    response: |
      key,summary,issuetype,status,priority,labels,created
      DMI-41,Add pagination to user list,Story,Open,High,agent-ready,2026-08-01
      DMI-42,Fix flicker on asset picker,Production Bug,Open,Critical,,2026-08-20
      DMI-43,Upgrade auth token service,Task,Backlog,High,,2026-08-19
  - match: view.*DMI-41.*assignee
    response: |
      {"key":"DMI-41","fields":{"assignee":{"accountId":"agent-1","emailAddress":"agent@ostack.dev"}}}
  - match: view.*DMI-41
    response: |
      {"key":"DMI-41","fields":{"assignee":null,"summary":"Add pagination to user list","description":"Split the user list endpoint. Acceptance criteria: page size 50 default; page param; tests.","labels":["agent-ready"],"status":{"name":"Open"}}}
  - match: assign.*DMI-41
    response: |
      Assigned DMI-41 to agent@ostack.dev
  - match: transition.*DMI-41
    response: |
      Transitioned DMI-41 to In Progress
  - match: comment create.*DMI-41
    response: |
      Comment created

assert:
  output_contains:
    - "Claimed DMI-41"
  tools_called:
    - "assign.*DMI-41"
    - "transition.*DMI-41"
  tools_not_called:
    - "assign.*DMI-4[23]"
    - "workitem comment"
  custom: |
    set -eu
    (cd "$WORK" && git branch --list | grep -q "DMI-41") || {
      echo "branch missing ticket key"; exit 1
    }
    test "$(cat "$WORK/src/app.ts")" = 'console.log(1)'
