skill: pick-next-task
description: Selects a candidate but does not claim it when other claimants cannot be coordinated.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  echo fixture > README.md
  git add -A && git commit -qm init

prompt: |
  Pick my next task from Jira project WEB, project-wide queue. The verified
  current account ID is agent-1. WEB-41 is agent-ready, unassigned, Open, and
  has complete acceptance criteria for pagination. The tracker only supports
  last-writer-wins assignment. Other agents may claim this queue concurrently;
  there is no shared claim lock or single dispatcher. Select the next item and
  tell me whether it can be safely claimed with this setup.

fixtures:
  - match: workitem search
    response: |
      key,summary,status,labels
      WEB-41,Add pagination,Open,agent-ready
  - match: view.*WEB-41
    response: |
      {"key":"WEB-41","fields":{"assignee":null,"status":{"name":"Open"},"labels":["agent-ready"],"description":"Add page and page_size parameters; default 50; reject invalid values."}}

assert:
  output_contains:
    - "WEB-41"
  tools_not_called:
    - "workitem assign"
    - "workitem transition"
    - "workitem comment"
  custom: |
    set -eu
    cd "$WORK"
    test "$(git branch --format='%(refname:short)' | wc -l | tr -d ' ')" -eq 1
    test -z "$(git status --porcelain)"
