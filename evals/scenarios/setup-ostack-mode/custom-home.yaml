skill: setup-ostack-mode
description: Uses OSTACK_CONFIG_HOME instead of the default home directory for an isolated configuration.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p "$WORK/portable-config"
  echo '# fixture' > README.md
  git add -A && git commit -qm init

prompt: |
  Run setup-ostack-mode with OSTACK_CONFIG_HOME set to $WORK/portable-config.
  For this test choose `inherit` for all four generic roles, do not configure
  advanced overrides, and write the complete validated file to that directory.
  Do not create ~/.config/ostack/models.json and do not edit pstack's model
  configuration.

assert:
  output_contains:
    - "portable-config"
  tools_not_called:
    - "glab"
    - "acli"
  custom: |
    test -f "$WORK/portable-config/models.json"
    test ! -e "$HOME/.config/ostack/models.json"
    jq -e '.version == 1 and ([.roles[]] | all(. == ["inherit"]))' "$WORK/portable-config/models.json" >/dev/null
