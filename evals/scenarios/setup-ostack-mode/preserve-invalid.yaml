skill: setup-ostack-mode
description: Rejects an invalid candidate without truncating the previous valid rule.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p "$HOME/.cursor/rules"
  cat > "$HOME/.cursor/rules/ostack-models.mdc" <<'MDC'
  ---
  description: ostack per-role model choices (overrides the skill defaults)
  alwaysApply: true
  ---
  exploration: inherit
  implementation: inherit
  judgment: inherit
  prose: inherit
  MDC
  cp "$HOME/.cursor/rules/ostack-models.mdc" "$WORK/expected.mdc"
  echo '# fixture' > README.md
  git add -A && git commit -qm init

prompt: |
  Run setup-ostack-mode's validation step against a candidate that sets the
  implementation role to an empty value and mixes `inherit` with a model ID on
  the judgment line. That candidate is invalid. Reject it, explain the
  validation error, and preserve the existing ~/.cursor/rules/ostack-models.mdc
  byte-for-byte. Do not write a partial rule and do not edit pstack's model
  rule.

assert:
  output_contains:
    - "invalid"
    - "preserve"
  tools_not_called:
    - "glab"
    - "acli"
  custom: |
    set -eu
    cmp -s "$HOME/.cursor/rules/ostack-models.mdc" "$WORK/expected.mdc"
