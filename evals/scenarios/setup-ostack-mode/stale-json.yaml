skill: setup-ostack-mode
description: Treats a legacy models.json as stale starting values, not as live configuration, and leaves it on disk.

setup: |
  git init -q -b main
  git config user.email dev@ostack.dev
  git config user.name dev
  mkdir -p "$HOME/.config/ostack" "$HOME/.cursor/rules"
  cat > "$HOME/.config/ostack/models.json" <<'JSON'
  {
    "version": 1,
    "roles": {
      "exploration": ["inherit"],
      "implementation": ["inherit"],
      "judgment": ["inherit"],
      "prose": ["inherit"]
    }
  }
  JSON
  echo '# fixture' > README.md
  git add -A && git commit -qm init

prompt: |
  Run setup-ostack-mode non-interactively for this test. A legacy
  ~/.config/ostack/models.json exists. Report that nothing reads it anymore,
  carry its values over as the starting choices, keep all four generic roles
  as `inherit`, and write ~/.cursor/rules/ostack-models.mdc. Leave the legacy
  file on disk. Do not edit pstack's model rule.

assert:
  output_contains:
    - "ostack-models.mdc"
    - "models.json"
  tools_not_called:
    - "glab"
    - "acli"
  custom: |
    set -eu
    rule="$HOME/.cursor/rules/ostack-models.mdc"
    grep -qx 'alwaysApply: true' "$rule"
    grep -qx 'exploration: inherit' "$rule"
    # the stale file is reported, never deleted
    test -f "$HOME/.config/ostack/models.json"
